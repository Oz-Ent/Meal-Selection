name: CI - develop

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

# Strict gate for develop: lint + component + e2e must all pass.
# eslint fails on errors only; warnings are allowed (default eslint behavior).
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  component:
    name: Cypress component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run component tests
        uses: cypress-io/github-action@v6
        with:
          # No component specs exist yet; pass cleanly instead of failing the
          # gate. Cypress errors ("no spec files found") otherwise exit non-zero.
          command: npm run test:cypress

  e2e:
    name: Cypress e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run e2e tests
        uses: cypress-io/github-action@v6
        env:
          # Staging API — currently points at the real API. Change the repo
          # variable VITE_MEAL_APP_CORE later to swap environments (no code change).
          VITE_MEAL_APP_CORE: ${{ vars.VITE_MEAL_APP_CORE || 'https://meal-app-core.vercel.app' }}
        with:
          start: npm run dev
          wait-on: http://localhost:5173
          wait-on-timeout: 120
